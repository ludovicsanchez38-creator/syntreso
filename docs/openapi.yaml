  /api/integrations/twenty/sync:
    post:
      tags:
      - Intégrations
      summary: Synchroniser le pipe commercial Twenty
      description: 'Lit les opportunités Twenty (TWENTY_URL, TWENTY_KEY), calcule le pipe pondéré par mois (pondérations
        de config/reglages.json), et crée des propositions `forecast_line` pour les hausses par rapport au prévisionnel.
        Les baisses sont seulement signalées (`decreases`). Idempotent. `?dry=1` : diagnostic seul.'
      operationId: synchroniserTwenty
      parameters:
      - name: dry
        in: query
        required: false
        description: Diagnostic sans création.
        schema:
          type: string
          enum:
          - '1'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
