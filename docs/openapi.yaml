      description: 'Réponse en flux Server-Sent Events : lignes `data: {json}` avec type chunk (texte), proposal
        (proposition créée), proposal_error, done ou error. Une seule question à la fois (429 sinon). Utile pour
        l''interface ; un agent externe a plutôt intérêt à appeler directement les routes de lecture et de décision.'
