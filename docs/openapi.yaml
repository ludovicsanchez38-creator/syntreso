  /api/integrations/recalage-charges:
    post:
      tags:
      - Intégrations
      summary: Proposer le recalage des charges sur le réalisé
      description: 'Compare le prévu de chaque charge à la médiane des 6 derniers mois clos et crée des propositions
        `forecast_recalage` au-delà de 30 % ET 50 EUR/mois d''écart. `?dry=1` (ou dryRun) : diagnostic seul.'
      operationId: recalerCharges
