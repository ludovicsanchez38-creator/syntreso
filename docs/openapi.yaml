              schema:
                $ref: '#/components/schemas/Erreur'
        '502':
          description: Twenty injoignable ou clé refusée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '503':
          description: Connecteur non configuré
          content:
