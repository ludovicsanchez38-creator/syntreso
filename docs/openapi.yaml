# Généré à partir des routes réellement montées (server/src/index.js, server/src/routes/*.js)
# et de réponses réelles du serveur (données de démonstration et import fictif).
openapi: 3.1.0
info:
  title: API Syntréso
  version: 1.0.0
  license:
    name: Usage privé, non redistribuable
    identifier: LicenseRef-Prive
  description: 'API de Syntréso, outil de pilotage de trésorerie d''une TPE (compta Indy, CRM Twenty).


    - Tous les montants sont en CENTIMES d''euro, entiers (12 000 EUR = 1200000). Positif = encaissement, négatif
    = décaissement.

    - Montants de trésorerie en TTC (ce qui passe en banque) ; compte de résultat et point mort en HT.

    - Mois au format AAAA-MM, dates AAAA-MM-JJ. La date du jour du moteur est `company.today` dans GET /api/state.

    - Principe : l''agent lit et simule librement, PROPOSE les écritures ; l''humain valide ; le serveur écrit.

    - Guide d''usage pour un agent : docs/GUIDE-AGENT.md.'
servers:
- url: http://127.0.0.1:3900
  description: Installation locale (Mac) ou serveur via tunnel SSH
- url: https://{domaine}
  description: Derrière un reverse proxy HTTPS
  variables:
    domaine:
      default: tresorerie.votre-domaine.fr
      description: Nom de domaine choisi pour l'appli
security:
- jeton: []
- cookieSession: []
tags:
- name: Système
  description: Santé du serveur et session navigateur.
- name: Lecture
  description: 'Situation, projection, échéances, compte de résultat : lecture seule, sans risque.'
- name: Décision
  description: 'Simulations et feux verts calculés par le serveur : rien n''est enregistré.'
- name: Prévisionnel
  description: Grille du prévisionnel ; la modification directe est réservée à l'humain.
- name: Propositions
  description: Écritures en attente de validation humaine.
- name: Scénarios
  description: Leviers « et si... » affichés à côté de la trajectoire de base.
- name: Import Indy
  description: Dépôt et import des exports comptables Indy (grand livre, balance).
- name: Intégrations
  description: 'Twenty (pipe commercial) et recalage des charges : produisent des propositions.'
- name: Assistant intégré
  description: Assistant IA embarqué dans l'interface (optionnel, coupé sans clé d'API ou par son interrupteur).
paths:
  /api/health:
    get:
      tags:
      - Système
      summary: Sonde de santé
      operationId: sante
      description: Seule route accessible sans jeton. Ne renvoie aucune donnée.
      security: []
      responses:
        '200':
          description: Serveur en marche
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  service:
                    type: string
                    example: syntreso-server
  /api/state:
    get:
      tags:
      - Lecture
      summary: Situation complète du jour
      description: 'Le point d''entrée de l''agent : entreprise, comptes, catégories, factures, indicateurs (kpis
        : solde brut, net disponible, TVA à reverser, cotisations provisionnées, point bas, autonomie en mois, point
        mort, résultat prévisionnel, compte courant d''associé), alertes actives, fraîcheur des données et contrôle
        de réconciliation bancaire. `company.today` est la date du jour retenue par le moteur : toujours la lire
        plutôt que d''utiliser l''horloge de l''agent.'
      operationId: lireEtat
      responses:
        '200':
          description: Situation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Etat'
        '503':
          description: Base non initialisée (npm run init ou npm run demo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '401':
          $ref: '#/components/responses/NonAutorise'
  /api/transactions:
    get:
      tags:
      - Lecture
      summary: Mouvements bancaires réels
      description: Mouvements importés d'Indy, du plus récent au plus ancien.
      operationId: listerTransactions
      parameters:
      - name: month
        in: query
        required: false
        description: Filtre sur un mois (AAAA-MM).
        schema:
          type: string
          pattern: ^\d{4}-\d{2}$
          example: 2026-11
      - name: categoryId
        in: query
        required: false
        description: Filtre sur une catégorie.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Nombre maximal de lignes.
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
        '401':
          $ref: '#/components/responses/NonAutorise'
  /api/forecast:
    get:
      tags:
      - Prévisionnel
      summary: Grille du prévisionnel
      description: 'Pour chaque catégorie et chaque mois (12 mois d''historique, 18 mois de projection) : réalisé,
        prévu, montant retenu par le moteur, note, détail, et si la case est modifiable. `closings` donne le solde
        de fin de mois.'
      operationId: lireGrille
      responses:
        '200':
          description: Grille
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrillePrevisionnel'
        '401':
          $ref: '#/components/responses/NonAutorise'
    patch:
      tags:
      - Prévisionnel
      summary: Modifier une case du prévisionnel (écriture directe)
      description: 'Pose le montant prévu d''une catégorie pour un mois (remplace la valeur, ne s''ajoute pas).
        Réservé au mois courant et aux mois futurs ; refusé sur les catégories calculées par le moteur (TVA, provision
        URSSAF, IS : passer par une proposition). Encaissement >= 0, décaissement <= 0. Écriture DIRECTE : pour
        un agent, préférer les propositions validées par l''humain.'
      operationId: modifierCase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - month
              - categoryId
              - amountCents
              properties:
                month:
                  type: string
                  pattern: ^\d{4}-\d{2}$
                  example: 2026-11
                categoryId:
                  type: string
                  example: dec_loyer
                amountCents:
                  type: integer
                  description: Centimes, négatif pour un décaissement.
                  example: -70000
                note:
                  type:
                  - string
                  - 'null'
            example:
              month: 2026-11
              categoryId: dec_loyer
              amountCents: -70000
              note: hausse du loyer
      responses:
        '200':
          description: Grille mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrillePrevisionnel'
        '400':
          description: Mois passé, catégorie inconnue ou pilotée, signe incohérent, montant non entier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '401':
          $ref: '#/components/responses/NonAutorise'
  /api/projection:
    get:
      tags:
      - Lecture
      summary: Courbe de trésorerie et projection
      description: Série quotidienne (réalisé puis projeté), tableau mensuel (ouverture, entrées, sorties, clôture),
        point bas, solde net disponible, autonomie. Avec `scenarios`, renvoie aussi la trajectoire alternative (bloc
        `scenario`) sans rien enregistrer.
      operationId: lireProjection
      parameters:
      - name: range
        in: query
        required: false
        description: Fenêtre affichée de la série (les indicateurs restent calculés sur tout l'horizon).
        schema:
          type: string
          enum:
          - 1M
          - 3M
          - 6M
          - 12M
      - name: scenarios
        in: query
        required: false
        description: Identifiants de scénarios à appliquer, séparés par des virgules.
        schema:
          type: string
          example: sc_embauche,sc_pret
      responses:
        '200':
          description: Projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Projection'
        '401':
          $ref: '#/components/responses/NonAutorise'
  /api/projection/remuneration-check:
    post:
      tags:
      - Décision
      summary: Feu vert « puis-je me verser X ? »
      description: Simule un versement de rémunération (et les cotisations associées si le pilotage TNS est activé),
        recalcule la trajectoire et rend un verdict vert / ambre / rouge calculé par le serveur. Ne modifie rien.
      operationId: verifierRemuneration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - montantCents
              properties:
                montantCents:
                  type: integer
                  minimum: 1
                  description: Montant en centimes.
                mois:
                  type: string
                  pattern: ^\d{4}-\d{2}$
                  example: 2026-11
                  description: 'Mois envisagé (défaut : mois courant).'
                horizonJours:
                  type: integer
                  description: Fenêtre de contrôle du point bas (défaut 60).
            example:
              montantCents: 300000
              mois: 2026-11
      responses:
        '200':
          description: Verdict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerdictRemuneration'
        '400':
          description: Montant invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '401':
          $ref: '#/components/responses/NonAutorise'
  /api/projection/cca-check:
    post:
      tags:
      - Décision
      summary: Feu vert « puis-je me rembourser X du compte courant d'associé ? »
      description: Comme le contrôle de rémunération, sans cotisations (remboursement de dette), plafonné par le
        compte courant réellement dû. Ne modifie rien.
      operationId: verifierRemboursementCca
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - montantCents
              properties:
                montantCents:
                  type: integer
                  minimum: 1
                  description: Montant en centimes.
                mois:
                  type: string
                  pattern: ^\d{4}-\d{2}$
                  example: 2026-11
                  description: 'Mois envisagé (défaut : mois courant).'
                horizonJours:
                  type: integer
            example:
              montantCents: 50000
      responses:
        '200':
          description: Verdict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerdictRemboursementCca'
        '400':
          description: Montant invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '401':
          $ref: '#/components/responses/NonAutorise'
  /api/projection/impact:
    post:
      tags:
      - Décision
      summary: Simuler l'impact d'une écriture prévisionnelle
      description: 'Applique une écriture fictive (mois, catégorie, montant signé) et compare avant / après : point
        bas, passage sous le seuil, autonomie. Ne modifie rien. À appeler avant toute proposition.'
      operationId: simulerImpact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - mois
              - categoryId
              - montantCents
              properties:
                mois:
                  type: string
                  pattern: ^\d{4}-\d{2}$
                  example: 2026-11
                categoryId:
                  type: string
                montantCents:
                  type: integer
                  description: Centimes, positif = encaissement, négatif = décaissement.
            example:
              mois: 2026-12
              categoryId: enc_prestations
              montantCents: 1200000
      responses:
        '200':
          description: Impact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImpactEcriture'
        '400':
          description: Paramètres invalides ou catégorie inconnue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '401':
          $ref: '#/components/responses/NonAutorise'
  /api/projection/dividendes-vs-remuneration:
    post:
      tags:
      - Décision
      summary: Comparer rémunération et dividendes
      description: Pour une enveloppe sortie de la société, net en poche par chaque voie (SARL à l'IS, gérant majoritaire
        TNS). Le net rémunération est AVANT impôt sur le revenu. Taux paramétrés dans company.fiscal. Ne modifie
        rien.
      operationId: comparerRemunerationDividendes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - montantCents
              properties:
                montantCents:
                  type: integer
                  minimum: 1
                  description: Montant en centimes.
                mois:
                  type: string
                  pattern: ^\d{4}-\d{2}$
                  example: 2026-11
                  description: 'Mois envisagé (défaut : mois courant).'
            example:
              montantCents: 1000000
      responses:
        '200':
          description: Comparaison
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemunerationOuDividendes'
        '400':
          description: Montant invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '401':
          $ref: '#/components/responses/NonAutorise'
  /api/compte-resultat:
    get:
      tags:
      - Lecture
      summary: Compte de résultat mensuel (HT)
      description: Produits et charges HT par mois de l'exercice, résultat avant et après IS estimé, ratios. Réalisé
        pour les mois passés, prévisionnel ensuite.
      operationId: lireCompteResultat
      parameters:
      - name: year
        in: query
        required: false
        description: 'Exercice (défaut : année en cours).'
        schema:
          type: string
          pattern: ^\d{4}$
      responses:
        '200':
          description: Compte de résultat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompteResultat'
        '401':
          $ref: '#/components/responses/NonAutorise'
  /api/scenarios:
    get:
      tags:
      - Scénarios
      summary: Scénarios « et si... »
      description: Leviers de simulation (embauche, investissement, prêt, retard d'encaissement...) avec leurs paramètres
        et curseurs.
      operationId: listerScenarios
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Scenario'
        '401':
          $ref: '#/components/responses/NonAutorise'
  /api/scenarios/{id}:
    put:
      tags:
      - Scénarios
      summary: Régler un scénario
      description: Change les paramètres d'un scénario et/ou l'active pour l'affichage. N'affecte que les simulations,
        jamais le prévisionnel.
      operationId: reglerScenario
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          example: sc_embauche
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                params:
                  type: object
                  additionalProperties: true
                active:
                  type: boolean
            example:
              params:
                monthlyCostCents: 320000
              active: true
      responses:
        '200':
          description: Scénario mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
        '400':
          description: Paramètre inconnu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '404':
          description: Scénario inconnu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '401':
          $ref: '#/components/responses/NonAutorise'
  /api/echeances:
    get:
      tags:
      - Lecture
      summary: Échéancier des sorties datées
      description: TVA, cotisations, IS, CFE et échéances saisies (donnees/echeances.json), datées au jour près
        sur l'horizon demandé.
      operationId: lireEcheancier
      parameters:
      - name: jours
        in: query
        required: false
        description: Horizon en jours.
        schema:
          type: integer
          minimum: 1
          maximum: 365
          default: 90
      responses:
        '200':
          description: Échéancier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Echeancier'
        '401':
          $ref: '#/components/responses/NonAutorise'
  /api/proposals:
    get:
      tags:
      - Propositions
      summary: Propositions (toutes)
      description: Toutes les propositions, quel que soit leur statut. Filtrer `status == 'pending'` pour celles
        qui attendent une décision humaine.
      operationId: listerPropositions
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Proposition'
        '401':
          $ref: '#/components/responses/NonAutorise'
    post:
      tags:
      - Propositions
      summary: Proposer une écriture (l'agent propose, l'humain valide)
      description: 'Crée une proposition EN ATTENTE, avec les mêmes contrôles que l''assistant intégré (mois courant
        ou futur, horizon de 18 mois, catégorie existante, signe cohérent : encaissement > 0, décaissement < 0).
        Rien n''est écrit au prévisionnel : la proposition apparaît dans l''interface (panneau assistant) où le
        dirigeant la valide ou la refuse. Sur les catégories calculées par le moteur (TVA, provision URSSAF, IS),
        le montant est un AJUSTEMENT qui s''ajoute au calcul.'
      operationId: proposerEcriture
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                title: Écriture prévisionnelle
                required:
                - kind
                - month
                - categoryId
                - amountCents
                - label
                properties:
                  kind:
                    type: string
                    enum:
                    - forecast_line
                  month:
                    type: string
                    pattern: ^\d{4}-\d{2}$
                    example: 2026-11
                  categoryId:
                    type: string
                  amountCents:
                    type: integer
                    description: 'Centimes signés : positif = encaissement, négatif = décaissement. S''AJOUTE au
                      prévu existant du mois.'
                  label:
                    type: string
                    maxLength: 200
              - type: object
                title: Recalage d'une charge
                required:
                - kind
                - categoryId
                - monthlyCents
                - fromMonth
                - toMonth
                - label
                properties:
                  kind:
                    type: string
                    enum:
                    - forecast_recalage
                  categoryId:
                    type: string
                    description: Catégorie de sortie.
                  monthlyCents:
                    type: integer
                    maximum: 0
                    description: Nouveau montant mensuel (négatif, 0 pour supprimer). REMPLACE le prévu sur la plage.
                  fromMonth:
                    type: string
                    pattern: ^\d{4}-\d{2}$
                    example: 2026-11
                    description: Premier mois (au plus tôt le mois prochain).
                  toMonth:
                    type: string
                    pattern: ^\d{4}-\d{2}$
                    example: 2026-11
                  label:
                    type: string
              - type: object
                title: Relance de facture
                required:
                - kind
                - invoiceId
                - draft
                properties:
                  kind:
                    type: string
                    enum:
                    - invoice_reminder
                  invoiceId:
                    type: string
                  draft:
                    type: string
            example:
              kind: forecast_line
              month: 2026-12
              categoryId: enc_prestations
              amountCents: 1200000
              label: Devis signé, paiement à 30 jours
      responses:
        '201':
          description: Proposition créée (pending)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposition'
        '400':
          description: Proposition refusée (motif dans error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '401':
          $ref: '#/components/responses/NonAutorise'
  /api/proposals/{id}/confirm:
    post:
      tags:
      - Propositions
      summary: Valider une proposition (décision humaine)
      description: 'Applique la proposition au prévisionnel. Amendements possibles : `amountCents` et `month` (forecast_line),
        `monthlyCents` (forecast_recalage). C''est la décision du dirigeant : un agent ne doit l''appeler que sur
        instruction explicite de l''humain.'
      operationId: validerProposition
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                amendments:
                  type: object
                  properties:
                    amountCents:
                      type: integer
                    month:
                      type: string
                      pattern: ^\d{4}-\d{2}$
                      example: 2026-11
                    monthlyCents:
                      type: integer
            example:
              amendments:
                amountCents: 900000
      responses:
        '200':
          description: Proposition validée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposition'
        '400':
          description: Amendement invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '404':
          description: Proposition inconnue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '409':
          description: Déjà validée ou rejetée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '401':
          $ref: '#/components/responses/NonAutorise'
  /api/proposals/{id}/reject:
    post:
      tags:
      - Propositions
      summary: Rejeter une proposition (décision humaine)
      description: Marque la proposition comme rejetée (rien n'est écrit au prévisionnel, la décision est gardée
        en mémoire de l'assistant).
      operationId: rejeterProposition
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Proposition rejetée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposition'
        '404':
          description: Proposition inconnue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '409':
          description: Déjà validée ou rejetée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '401':
          $ref: '#/components/responses/NonAutorise'
  /api/audit:
    get:
      tags:
      - Lecture
      summary: Journal des modifications
      description: 'Dernières lignes du journal (qui a modifié quoi : utilisateur, agent, import), les plus récentes
        en dernier.'
      operationId: lireJournal
      parameters:
      - name: limit
        in: query
        required: false
        description: Nombre de lignes.
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      responses:
        '200':
          description: Journal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalAudit'
        '401':
          $ref: '#/components/responses/NonAutorise'
  /api/qualite-previsions:
    get:
      tags:
      - Lecture
      summary: Prévu ou réalisé d'un mois clos
      description: Compare le prévisionnel archivé au début du mois au réalisé, par catégorie. `format=text` renvoie
        un bloc texte prêt à relayer.
      operationId: lireQualitePrevisions
      parameters:
      - name: month
        in: query
        required: false
        description: 'Mois clos (défaut : mois précédent).'
        schema:
          type: string
          pattern: ^\d{4}-\d{2}$
          example: 2026-11
      - name: format
        in: query
        required: false
        description: text pour un bloc texte.
        schema:
          type: string
          enum:
          - text
      responses:
        '200':
          description: Comparaison
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualitePrevisions'
            text/plain:
              schema:
                type: string
        '401':
