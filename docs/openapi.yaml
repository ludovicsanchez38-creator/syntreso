        '200':
          description: Page HTML
          content:
            text/html:
              schema:
                type: string
    post:
      tags:
      - Système
      summary: Ouvrir une session navigateur
      operationId: connexion
      security: []
      description: Vérifie le jeton et pose le cookie de session `syntreso_session` (HttpOnly, 30 jours), puis redirige
        vers /.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - jeton
              properties:
                jeton:
                  type: string
      responses:
        '303':
          description: Session ouverte, redirection vers /
        '401':
          description: Jeton incorrect (page HTML avec message)
          content:
            text/html:
              schema:
                type: string
