  /api/import/indy:
    get:
      tags:
      - Import Indy
      summary: Aperçu du dossier d'entrée Indy
      description: Liste les exports reconnus dans le dossier d'entrée (un grand livre par exercice, la balance
        la plus récente) et ceux qui seront ignorés. Ne lit ni n'écrit aucune donnée.
      operationId: apercuImportIndy
      responses:
        '200':
          description: Aperçu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApercuImport'
        '422':
          description: Dossier d'entrée introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '401':
          $ref: '#/components/responses/NonAutorise'
    post:
      tags:
      - Import Indy
      summary: Importer les exports Indy
      description: 'Relit les grands livres et la balance du dossier d''entrée, reconstruit les mouvements bancaires,
        la dette de TVA, le compte courant d''associé et le prévisionnel de base (les saisies et propositions validées
        sont conservées). `simulation: true` renvoie le rapport sans rien écrire : à faire d''abord. Vérifier ensuite
        `reconciliation.statut == ''ok''`.'
      operationId: importerIndy
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                simulation:
                  type: boolean
                  default: false
                reinitialiserPrevisionnel:
                  type: boolean
                  default: false
                  description: 'true : repart d''un prévisionnel neuf (les saisies manuelles sont perdues).'
            example:
              simulation: true
      responses:
        '200':
          description: Rapport d'import
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RapportImport'
        '422':
          description: Exports manquants ou illisibles, base non initialisée, catégorie inconnue dans les réglages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '401':
          $ref: '#/components/responses/NonAutorise'
  /api/import/indy/fichiers/{nom}:
    put:
      tags:
      - Import Indy
      summary: Déposer un export Indy dans le dossier d'entrée
      description: 'Corps = contenu CSV brut (en-tête Content-Type: text/csv). Le serveur vérifie qu''il s''agit
        d''un grand livre ou d''une balance Indy. Un fichier de même nom est remplacé.'
      operationId: deposerExportIndy
      parameters:
      - name: nom
        in: path
        required: true
        schema:
          type: string
          pattern: ^[\w .()-]{1,120}\.csv$
          example: grand-livre-2026.csv
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
      responses:
        '201':
          description: Fichier déposé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepotFichier'
        '400':
          description: Nom de fichier invalide
          content:
